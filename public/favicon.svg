<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- dark terminal tile -->
  <rect width="32" height="32" rx="6" fill="#0a0e14"/>
  <!-- crossbones behind the skull -->
  <line x1="6" y1="18" x2="26" y2="14" stroke="#2e3f55" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="6" y1="14" x2="26" y2="18" stroke="#2e3f55" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="6" cy="14" r="1.5" fill="#2e3f55"/>
  <circle cx="6" cy="18" r="1.5" fill="#2e3f55"/>
  <circle cx="26" cy="14" r="1.5" fill="#2e3f55"/>
  <circle cx="26" cy="18" r="1.5" fill="#2e3f55"/>

  <!-- straw hat crown + brim -->
  <path d="M11 9 Q16 0 21 9 Z" fill="#ffd66b"/>
  <ellipse cx="16" cy="8.5" rx="10" ry="2.5" fill="#ffd66b"/>
  <rect x="11.5" y="7" width="9" height="2" rx="1" fill="#ff6b6b"/>

  <!-- skull -->
  <circle cx="16" cy="17" r="8" fill="#dfe7f0"/>
  <rect x="12.6" y="14.5" width="2.4" height="3.4" rx="1.1" fill="#0a0e14"/>
  <rect x="17" y="14.5" width="2.4" height="3.4" rx="1.1" fill="#0a0e14"/>
  <path d="M14.3 19.4 L17.7 19.4 L16 21.8 Z" fill="#0a0e14"/>
  <path d="M11.5 20.5 Q16 25.5 20.5 20.5" fill="none" stroke="#9fb3c8" stroke-width="1.4" stroke-linecap="round"/>
</svg>
